<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Igris -Migration Tool</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&display=swap');
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
    .container { background: #1e293b; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); max-width: 600px; width: 100%; border: 1px solid #334155; }
    h1 { color: #38bdf8; font-family: 'Montserrat', sans-serif; text-align: center; margin-top: 0; }
    .step-box { background: rgba(0,0,0,0.2); padding: 16px; border-radius: 12px; margin-bottom: 20px; border: 1px dashed #475569; }
    input[type="file"] { width: 100%; padding: 10px; background: #0f172a; border-radius: 8px; color: #38bdf8; border: 1px solid #38bdf8; cursor: pointer; }
    button { width: 100%; padding: 14px; font-size: 16px; font-weight: bold; color: white; background: linear-gradient(135deg, #10b981 0%, #047857 100%); border: none; border-radius: 12px; cursor: pointer; transition: 0.3s; margin-top: 10px; }
    button:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(16, 185, 129, 0.4); }
    button:disabled { background: #475569; cursor: not-allowed; box-shadow: none; transform: none; }
    .log-box { background: #000; color: #10b981; font-family: monospace; font-size: 12px; padding: 15px; border-radius: 10px; height: 250px; overflow-y: auto; margin-top: 20px; border: 1px solid #334155; }
    .progress-bar-container { width: 100%; background: #334155; border-radius: 8px; margin-top: 10px; overflow: hidden; display: none; }
    .progress-bar { height: 12px; background: #38bdf8; width: 0%; transition: width 0.3s; }
  </style>
</head>
<body>

  <div class="container">
    <h1>🚀 Database Migrator</h1>
    <p style="text-align: center; color: #94a3b8; font-size: 14px;">Realtime Database JSON ➡️ Cloud Firestore</p>

    <div class="step-box">
      <label style="font-weight: bold; margin-bottom: 8px; display: block; color: #fbbf24;">1. Select Exported JSON File:</label>
      <input type="file" id="jsonFileInput" accept=".json">
    </div>

    <button id="startBtn" disabled>Start Migration to Firestore</button>

    <div class="progress-bar-container" id="progressContainer">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    
    <div class="log-box" id="logBox">
      [System] Ready. Please select a JSON file.
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, writeBatch, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // 🔴 APNA FIREBASE CONFIG YAHAN PASTE KAREIN
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const fsDb = getFirestore(app);

    const fileInput = document.getElementById("jsonFileInput");
    const startBtn = document.getElementById("startBtn");
    const logBox = document.getElementById("logBox");
    const progressBar = document.getElementById("progressBar");
    const progressContainer = document.getElementById("progressContainer");

    let parsedData = null;

    function log(msg, color = "#10b981") {
      const p = document.createElement("div");
      p.style.color = color;
      p.innerText = `> ${msg}`;
      logBox.appendChild(p);
      logBox.scrollTop = logBox.scrollHeight;
    }

    fileInput.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      log(`Loading file: ${file.name}...`, "#38bdf8");
      
      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          parsedData = JSON.parse(event.target.result);
          log(`✔ JSON File Loaded Successfully! Found ${Object.keys(parsedData).length} main nodes.`, "#fbbf24");
          startBtn.disabled = false;
        } catch (err) {
          log("❌ Invalid JSON File!", "#ef4444");
        }
      };
      reader.readAsText(file);
    });

    // Smart Mapper Engine: JSON to Firestore Paths
    function generateFirestoreOperations(data) {
      const operations = [];

      // Category 1: Flat Collections (e.g. students/{admn})
      const flatNodes = ['students', 'teachers', 'users', 'email_lookup', 'teacher_points_logs', 'student_permissions', 'teacher_permissions', 'enabled_syllabus'];
      flatNodes.forEach(node => {
        if (data[node]) {
          Object.entries(data[node]).forEach(([docId, docData]) => {
            // Firestore mein keys string honi chahiye
            operations.push({ path: `${node}/${String(docId)}`, data: typeof docData === 'object' ? docData : { value: docData } });
          });
        }
      });

      // Category 2: Class Nested (e.g. study_material/{classId}/items/{matId})
      const classNestedNodes = ['study_material', 'homework', 'online_tests', 'subjects'];
      classNestedNodes.forEach(node => {
        if (data[node]) {
          Object.entries(data[node]).forEach(([classId, items]) => {
            Object.entries(items).forEach(([itemId, itemData]) => {
              operations.push({ path: `${node}/${classId}/items/${itemId}`, data: itemData });
            });
          });
        }
      });

      // Category 3: User Nested (e.g. fees_entries/{admn}/records/{entryId})
      const userNestedNodes = ['leave_applications', 'teacher_leave_applications', 'tests', 'daily_claims', 'teacher_daily_claims', 'notifications', 'fees_matrix', 'fees_entries', 'student_test_attempts'];
      userNestedNodes.forEach(node => {
        if (data[node]) {
          Object.entries(data[node]).forEach(([userId, records]) => {
            Object.entries(records).forEach(([recordId, recordData]) => {
              operations.push({ path: `${node}/${userId}/records/${recordId}`, data: typeof recordData === 'object' ? recordData : { value: recordData } });
            });
          });
        }
      });

      // Special Case 1: Expenses
      if (data.expenses) {
        Object.entries(data.expenses).forEach(([month, records]) => {
          Object.entries(records).forEach(([expId, expData]) => {
            operations.push({ path: `expenses/${month}/records/${expId}`, data: expData });
          });
        });
      }

      // Special Case 2: Attendance
      if (data.attendance) {
        Object.entries(data.attendance).forEach(([admn, months]) => {
          Object.entries(months).forEach(([month, days]) => {
            operations.push({ path: `attendance/${admn}/months/${month}`, data: days });
          });
        });
      }

      // Special Case 3: Muster
      if (data.muster) {
        Object.entries(data.muster).forEach(([month, days]) => {
          Object.entries(days).forEach(([day, teachers]) => {
            operations.push({ path: `muster/${month}/days/${day}`, data: teachers });
          });
        });
      }

      return operations;
    }

    startBtn.addEventListener("click", async () => {
      if (!parsedData) return;
      startBtn.disabled = true;
      startBtn.innerText = "⏳ Migrating Please Wait...";
      progressContainer.style.display = "block";

      log("Analyzing JSON structure and preparing Firestore batches...");
      const operations = generateFirestoreOperations(parsedData);
      const totalOps = operations.length;
      log(`Total documents to write: ${totalOps}`, "#fbbf24");

      if (totalOps === 0) {
        log("No data found to migrate.", "#ef4444");
        return;
      }

      // Firestore Batch limit is 500. We use chunks of 400 for safety.
      const CHUNK_SIZE = 400;
      let completedOps = 0;

      for (let i = 0; i < totalOps; i += CHUNK_SIZE) {
        const chunk = operations.slice(i, i + CHUNK_SIZE);
        const batch = writeBatch(fsDb);

        chunk.forEach(op => {
          const docRef = doc(fsDb, op.path);
          batch.set(docRef, op.data);
        });

        try {
          await batch.commit();
          completedOps += chunk.length;
          
          // Update UI Progress
          const percentage = Math.round((completedOps / totalOps) * 100);
          progressBar.style.width = `${percentage}%`;
          log(`Migrated ${completedOps} / ${totalOps} documents...`);
          
        } catch (error) {
          log(`❌ Error in batch ${i/CHUNK_SIZE + 1}: ${error.message}`, "#ef4444");
        }
      }

      log("🎉 MIGRATION COMPLETED SUCCESSFULLY!", "#10b981");
      startBtn.innerText = "✔ Migration Done";
      startBtn.style.background = "#10b981";
    });

  </script>
</body>
</html>
