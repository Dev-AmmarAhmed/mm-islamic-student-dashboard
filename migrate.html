<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AccuEngine - Bulletproof Master Migration</title>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0b1329; color: #f8fafc; padding: 20px; margin: 0; }
    .container { max-width: 860px; margin: auto; background: #131d36; border-radius: 16px; padding: 24px; border: 1px solid #1e293b; box-shadow: 0 10px 35px rgba(0,0,0,0.5); }
    h1 { color: #38bdf8; font-size: 20px; margin-top: 0; }
    p { color: #94a3b8; font-size: 13px; line-height: 1.5; margin-bottom: 14px; }
    .card { background: #1e293b; padding: 16px; border-radius: 12px; margin: 14px 0; border: 1px solid #334155; }
    input[type="file"] { background: #0f172a; border: 1px dashed #38bdf8; padding: 14px; border-radius: 8px; width: 100%; box-sizing: border-box; color: #cbd5e1; cursor: pointer; }
    button { background: #16a34a; color: white; border: none; padding: 12px 20px; border-radius: 8px; font-weight: 800; font-size: 14px; cursor: pointer; width: 100%; transition: opacity 0.2s; }
    button:disabled { background: #475569 !important; cursor: not-allowed; }
    .progress-bar-bg { width: 100%; height: 8px; background: #1e293b; border-radius: 6px; overflow: hidden; margin: 14px 0; }
    .progress-bar-fill { height: 100%; width: 0%; background: #38bdf8; transition: width 0.3s; }
    #logBox { background: #000; color: #4ade80; padding: 14px; border-radius: 10px; font-family: monospace; font-size: 12px; height: 360px; overflow-y: auto; white-space: pre-wrap; line-height: 1.6; border: 1px solid #1e293b; }
    .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 800; background: rgba(56, 189, 248, 0.2); color: #38bdf8; }
  </style>
</head>
<body>
  <div class="container">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h1>🚀 Master Migration to Firestore (Null-Safe)</h1>
      <span class="badge">AccuEngine Master v4.2</span>
    </div>
    <p>
      Users, Students, Teachers, Fees Matrix, Fees Receipts, Attendance, Tests, Attempts, aur Claims ka data Cloud Firestore mein safely sync karein.
    </p>

    <div class="card">
      <label style="font-size:12px; font-weight:800; color:#38bdf8; display:block; margin-bottom:8px;">
        12.58 MB Backup JSON File Select Karein:
      </label>
      <input type="file" id="jsonFileInput" accept=".json">
      <button id="btnStart" style="margin-top:14px;" onclick="runMasterMigration()" disabled>
        ⚡ Finish Migration to Firestore
      </button>
    </div>

    <div class="progress-bar-bg">
      <div id="progBar" class="progress-bar-fill"></div>
    </div>

    <div id="logBox">Console Ready. Backup JSON file select karein...</div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBHpbgoGs7HFQ3-1tBn9BpGT4YYDaKkZB8",
      authDomain: "mm-islamic-erp.firebaseapp.com",
      databaseURL: "https://mm-islamic-erp-default-rtdb.firebaseio.com",
      projectId: "mm-islamic-erp",
      storageBucket: "mm-islamic-erp.firebasestorage.app",
      messagingSenderId: "547338314533",
      appId: "1:547338314533:web:3973c2b36ef8b3b01170cc"
    };

    firebase.initializeApp(firebaseConfig);
    const firestore = firebase.firestore();
    const auth = firebase.auth();

    function log(msg, isErr = false) {
      const b = document.getElementById("logBox");
      b.textContent += "\n" + (isErr ? "❌ " : "👉 ") + msg;
      b.scrollTop = b.scrollHeight;
    }

    function setProg(pct) {
      document.getElementById("progBar").style.width = pct + "%";
    }

    auth.signInAnonymously().catch(e => {
      log("Auth Warning: " + e.message);
    });

    document.getElementById("jsonFileInput").addEventListener("change", function() {
      document.getElementById("btnStart").disabled = !this.files.length;
      if (this.files.length) {
        log(`Selected File: ${this.files[0].name} (${(this.files[0].size / (1024*1024)).toFixed(2)} MB)`);
      }
    });

    class FirestoreBatchWriter {
      constructor() {
        this.batch = firestore.batch();
        this.count = 0;
        this.total = 0;
      }
      async set(docRef, data) {
        this.batch.set(docRef, data, { merge: true });
        this.count++;
        this.total++;
        if (this.count >= 250) {
          await this.batch.commit();
          log(`   [Firestore] ${this.total} documents saved...`);
          this.batch = firestore.batch();
          this.count = 0;
        }
      }
      async commit() {
        if (this.count > 0) {
          await this.batch.commit();
          log(`   [Batch Finalized] Total ${this.total} documents written.`);
          this.count = 0;
          this.batch = firestore.batch();
        }
      }
    }

    async function runMasterMigration() {
      const fileInput = document.getElementById("jsonFileInput");
      if (!fileInput.files[0]) return;

      const btn = document.getElementById("btnStart");
      btn.disabled = true;

      log("\n========================================================");
      log("Reading and parsing JSON file...");

      const reader = new FileReader();
      reader.onload = async function(e) {
        try {
          const fullData = JSON.parse(e.target.result);
          log(`JSON Parsed! Size: ${(e.target.result.length / (1024*1024)).toFixed(2)} MB`);

          const writer = new FirestoreBatchWriter();

          // 1. USERS
          if (fullData.users && typeof fullData.users === "object") {
            const uKeys = Object.keys(fullData.users);
            log(`\n[1/10] Migrating ${uKeys.length} Users...`);
            for (let u of uKeys) {
              if (fullData.users[u]) {
                await writer.set(firestore.collection("users").doc(String(u)), fullData.users[u]);
              }
            }
            await writer.commit();
            setProg(10);
            log(`✔ Users credentials migrated.`);
          }

          // 2. STUDENTS (Strip Base64 Images)
          if (fullData.students && typeof fullData.students === "object") {
            const sKeys = Object.keys(fullData.students);
            log(`\n[2/10] Migrating ${sKeys.length} Students...`);
            for (let admn of sKeys) {
              if (fullData.students[admn]) {
                const sObj = { ...fullData.students[admn] };
                sObj.photo = "";
                sObj.admn = String(admn);
                await writer.set(firestore.collection("students").doc(String(admn)), sObj);
              }
            }
            await writer.commit();
            setProg(20);
            log(`✔ Students directory migrated.`);
          }

          // 3. TEACHERS
          if (fullData.teachers && typeof fullData.teachers === "object") {
            const tKeys = Object.keys(fullData.teachers);
            log(`\n[3/10] Migrating ${tKeys.length} Teachers...`);
            for (let user of tKeys) {
              if (fullData.teachers[user]) {
                const tObj = { ...fullData.teachers[user] };
                tObj.photo = "";
                tObj.username = String(user);
                await writer.set(firestore.collection("teachers").doc(String(user)), tObj);
              }
            }
            await writer.commit();
            setProg(30);
            log(`✔ Teachers profiles migrated.`);
          }

          // 4. FEES MATRIX
          const matrixNode = fullData.fees_matrix || fullData.fees_records || {};
          const mKeys = Object.keys(matrixNode);
          log(`\n[4/10] Migrating ${mKeys.length} Students in fees_matrix...`);
          for (let admn of mKeys) {
            if (matrixNode[admn]) {
              await writer.set(firestore.collection("fees_matrix").doc(String(admn)), {
                admn: String(admn),
                matrix: matrixNode[admn],
                updatedAt: new Date().toISOString()
              });
            }
          }
          await writer.commit();
          setProg(45);
          log(`✔ All student fees_matrix records migrated.`);

          // 5. FEES ENTRIES
          if (fullData.fees_entries && typeof fullData.fees_entries === "object") {
            log(`\n[5/10] Migrating Fees Entries / Receipts...`);
            let receiptCount = 0;
            for (let admn of Object.keys(fullData.fees_entries)) {
              const stEntries = fullData.fees_entries[admn];
              if (stEntries && typeof stEntries === "object") {
                for (let entryId of Object.keys(stEntries)) {
                  const entryData = stEntries[entryId];
                  if (entryData && typeof entryData === "object") {
                    receiptCount++;
                    await writer.set(firestore.collection("fees_entries").doc(`${admn}_${entryId}`), {
                      ...entryData,
                      admn: String(admn),
                      entryId: String(entryId),
                      id: String(entryData.id || entryId)
                    });
                  }
                }
              }
            }
            await writer.commit();
            setProg(60);
            log(`✔ ${receiptCount} Fees Receipts migrated.`);
          }

          // 6. ATTENDANCE
          if (fullData.attendance && typeof fullData.attendance === "object") {
            log(`\n[6/10] Migrating Attendance Sheets...`);
            let sheetCount = 0;
            for (let admn of Object.keys(fullData.attendance)) {
              const months = fullData.attendance[admn];
              if (months && typeof months === "object") {
                for (let m of Object.keys(months)) {
                  if (months[m]) {
                    sheetCount++;
                    await writer.set(firestore.collection("attendance").doc(`${admn}_${m}`), {
                      admn: String(admn),
                      month: String(m),
                      days: months[m],
                      updatedAt: new Date().toISOString()
                    });
                  }
                }
              }
            }
            await writer.commit();
            setProg(75);
            log(`✔ ${sheetCount} Monthly Attendance sheets migrated.`);
          }

          // 7. OFFLINE TESTS
          if (fullData.tests && typeof fullData.tests === "object") {
            log(`\n[7/10] Migrating Offline Tests...`);
            let testCount = 0;
            for (let admn of Object.keys(fullData.tests)) {
              const stTests = fullData.tests[admn];
              if (stTests && typeof stTests === "object") {
                for (let tid of Object.keys(stTests)) {
                  if (stTests[tid]) {
                    testCount++;
                    await writer.set(firestore.collection("tests").doc(`${admn}_${tid}`), {
                      ...stTests[tid],
                      admn: String(admn),
                      testId: String(tid)
                    });
                  }
                }
              }
            }
            await writer.commit();
            setProg(85);
            log(`✔ ${testCount} Offline Tests migrated.`);
          }

          // 8. ONLINE TESTS (Fixed Null Guard)
          if (fullData.online_tests && typeof fullData.online_tests === "object") {
            log(`\n[8/10] Migrating Online Tests...`);
            let otCount = 0;
            for (let cls of Object.keys(fullData.online_tests)) {
              const classTests = fullData.online_tests[cls];
              if (classTests && typeof classTests === "object") {
                for (let tid of Object.keys(classTests)) {
                  const tObj = classTests[tid];
                  if (tObj && typeof tObj === "object") {
                    otCount++;
                    await writer.set(firestore.collection("online_tests").doc(String(tid)), {
                      ...tObj,
                      id: String(tid),
                      class: String(cls)
                    });
                  }
                }
              }
            }
            await writer.commit();
            setProg(90);
            log(`✔ ${otCount} Online Tests migrated.`);
          }

          // 9. TEST ATTEMPTS (Fixed Null Guard)
          const attemptsNode = fullData.test_attempts || fullData.student_test_attempts || {};
          if (attemptsNode && typeof attemptsNode === "object") {
            log(`\n[9/10] Migrating Test Attempts...`);
            let attCount = 0;
            for (let tid of Object.keys(attemptsNode)) {
              const attemptsObj = attemptsNode[tid];
              if (attemptsObj && typeof attemptsObj === "object") {
                for (let admn of Object.keys(attemptsObj)) {
                  const attData = attemptsObj[admn];
                  if (attData && typeof attData === "object") {
                    attCount++;
                    await writer.set(firestore.collection("test_attempts").doc(`${tid}_${admn}`), {
                      ...attData,
                      testId: String(tid),
                      admn: String(admn)
                    });
                  }
                }
              }
            }
            await writer.commit();
            setProg(95);
            log(`✔ ${attCount} Test Attempts migrated.`);
          }

          // 10. EXPENSES & DAILY CLAIMS (Fixed Null Guard)
          if (fullData.expenses && typeof fullData.expenses === "object") {
            log(`\n[10/10] Migrating Expenses & Claims...`);
            for (let m of Object.keys(fullData.expenses)) {
              const monthExp = fullData.expenses[m];
              if (monthExp && typeof monthExp === "object") {
                for (let eid of Object.keys(monthExp)) {
                  if (monthExp[eid]) {
                    await writer.set(firestore.collection("expenses").doc(`${m}_${eid}`), monthExp[eid]);
                  }
                }
              }
            }
          }

          if (fullData.daily_claims && typeof fullData.daily_claims === "object") {
            for (let admn of Object.keys(fullData.daily_claims)) {
              if (fullData.daily_claims[admn]) {
                await writer.set(firestore.collection("daily_claims").doc(String(admn)), {
                  claims: fullData.daily_claims[admn]
                });
              }
            }
          }
          await writer.commit();
          setProg(100);

          log("\n🎉 [MASTER MIGRATION 100% COMPLETE]");
          log("Saara core data (Users, Students, Teachers, Fees Matrix, Receipts, Attendance, Tests, Attempts, Expenses) bina kisi error ke Cloud Firestore mein transfer ho chuka hai!");
        } catch (err) {
          log("Migration Error: " + err.message, true);
        } finally {
          btn.disabled = false;
        }
      };

      reader.readAsText(fileInput.files[0]);
    }
  </script>
</body>
</html>
