<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>M.M ISLAMIC ERP - Data Migration Engine</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0b132b; color: #f8fafc; padding: 24px; display: flex; justify-content: center; }
    .card { background: #1c2541; padding: 30px; border-radius: 18px; max-width: 650px; width: 100%; box-shadow: 0 10px 30px rgba(0,0,0,0.4); border: 1px solid #3a506b; }
    h2 { color: #38bdf8; margin-top: 0; font-size: 20px; }
    p { font-size: 13px; color: #94a3b8; line-height: 1.5; }
    input[type="file"] { width: 100%; padding: 12px; margin: 15px 0; background: #0b132b; border: 1.5px dashed #38bdf8; border-radius: 12px; color: #f8fafc; cursor: pointer; }
    button { width: 100%; padding: 14px; background: linear-gradient(135deg, #10b981 0%, #047857 100%); color: white; border: none; border-radius: 12px; font-weight: 800; font-size: 14px; cursor: pointer; margin-top: 10px; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .log-box { background: #0b132b; border: 1px solid #3a506b; border-radius: 10px; padding: 14px; height: 260px; overflow-y: auto; font-family: monospace; font-size: 11.5px; color: #38bdf8; margin-top: 20px; }
    .progress-bar { width: 100%; height: 8px; background: #0b132b; border-radius: 4px; overflow: hidden; margin-top: 15px; }
    .progress-fill { width: 0%; height: 100%; background: #10b981; transition: width 0.2s ease; }
  </style>
</head>
<body>

<div class="card">
  <h2>⚡ MM Islamic ERP - Database Migration Tool</h2>
  <p>Apna backup JSON file (<code>mm-islamic-erp-default-rtdb-export (1).json</code>) choose karein aur niche diye gaye button par click karein. Yeh tool sabhi nodes ko standard collections aur documents me parse karke Firestore me push karega.</p>

  <input type="file" id="jsonFileInput" accept=".json">
  <button id="startBtn" disabled>🚀 Start Auto Migration</button>

  <div class="progress-bar">
    <div id="progressFill" class="progress-fill"></div>
  </div>

  <div id="logBox" class="log-box">Logs will appear here...</div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, doc, writeBatch, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
  import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBHpbgoGs7HFQ3-1tBn9BpGT4YYDaKkZB8",
    authDomain: "mm-islamic-erp.firebaseapp.com",
    databaseURL: "https://mm-islamic-erp-default-rtdb.firebaseio.com",
    projectId: "mm-islamic-erp",
    storageBucket: "mm-islamic-erp.firebasestorage.app",
    messagingSenderId: "547338314533",
    appId: "1:547338314533:web:3973c2b36ef8b3b01170cc"
  };

  const app = initializeApp(firebaseConfig);
  const fsDb = getFirestore(app);
  const rtdb = getDatabase(app);

  const fileInput = document.getElementById("jsonFileInput");
  const startBtn = document.getElementById("startBtn");
  const logBox = document.getElementById("logBox");
  const progressFill = document.getElementById("progressFill");

  let parsedData = null;

  function log(msg) {
    const time = new Date().toLocaleTimeString();
    logBox.innerHTML += `<div>[${time}] ${msg}</div>`;
    logBox.scrollTop = logBox.scrollHeight;
  }

  fileInput.addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        parsedData = JSON.parse(ev.target.result);
        log(`✔ File parsed successfully! Ready to migrate.`);
        startBtn.disabled = false;
      } catch (err) {
        log(`❌ Invalid JSON file: ${err.message}`);
      }
    };
    reader.readAsText(file);
  });

  async function commitBatchOperations(operationsList) {
    const CHUNK_SIZE = 450;
    const total = operationsList.length;
    for (let i = 0; i < total; i += CHUNK_SIZE) {
      const batch = writeBatch(fsDb);
      const chunk = operationsList.slice(i, i + CHUNK_SIZE);
      chunk.forEach(op => {
        const docRef = doc(fsDb, op.collection, String(op.id));
        batch.set(docRef, op.data, { merge: true });
      });
      await batch.commit();
      const pct = Math.round(((i + chunk.length) / total) * 100);
      progressFill.style.width = pct + "%";
      log(`Pushed batch ${i + chunk.length} / ${total} documents...`);
    }
  }

  startBtn.addEventListener("click", async () => {
    if (!parsedData) return;
    startBtn.disabled = true;
    log("🚀 Starting database structuring and migration...");

    const operations = [];

    // 1. Students Collection
    if (parsedData.students) {
      log("Analyzing Students data...");
      Object.entries(parsedData.students).forEach(([admn, st]) => {
        if (st && typeof st === 'object') {
          operations.push({
            collection: "students",
            id: admn,
            data: {
              admn: String(st.admn || admn),
              name: st.name || "Student",
              class: String(st.class || "1").replace(/class\s*/i, "").trim(),
              phone: st.phone || "",
              dob: st.dob || "-",
              photo: st.photo || "",
              points: Number(st.points) || 0,
              regDate: st.regDate || "",
              customFee: st.customFee !== undefined ? Number(st.customFee) : null
            }
          });
        }
      });
    }

    // 2. Teachers Collection
    if (parsedData.teachers) {
      log("Analyzing Teachers data...");
      Object.entries(parsedData.teachers).forEach(([user, t]) => {
        if (t && typeof t === 'object') {
          operations.push({
            collection: "teachers",
            id: user,
            data: {
              username: String(t.username || user),
              name: t.name || user,
              assignedClass: t.assignedClass || "1",
              phone: t.phone || "",
              email: t.email || "",
              photo: t.photo || "",
              points: Number(t.points) || 0,
              regDate: t.regDate || ""
            }
          });
        }
      });
    }

    // 3. Users Credentials Vault
    if (parsedData.users) {
      log("Analyzing Users credentials...");
      Object.entries(parsedData.users).forEach(([uid, u]) => {
        if (u && typeof u === 'object') {
          operations.push({
            collection: "users",
            id: uid,
            data: {
              password: String(u.password || "MM"),
              role: u.role || "student",
              admn: u.admn ? String(u.admn) : String(uid),
              assignedClass: u.assignedClass || "",
              email: u.email || ""
            }
          });
        }
      });
    }

    // 4. Fees Matrix (Per Student)
    if (parsedData.fees_matrix) {
      log("Analyzing Fees Matrix records...");
      Object.entries(parsedData.fees_matrix).forEach(([admn, matrix]) => {
        if (matrix && typeof matrix === 'object') {
          operations.push({
            collection: "fees_matrix",
            id: admn,
            data: {
              admn: String(admn),
              matrix: matrix,
              updatedAt: new Date().toISOString()
            }
          });
        }
      });
    }

    // 5. Fees Entries (Receipts)
    if (parsedData.fees_entries) {
      log("Analyzing Fees Entries logs...");
      Object.entries(parsedData.fees_entries).forEach(([admn, logs]) => {
        if (logs && typeof logs === 'object') {
          Object.entries(logs).forEach(([entryId, entry]) => {
            if (entry && typeof entry === 'object') {
              operations.push({
                collection: "fees_entries",
                id: `${admn}_${entryId}`,
                data: {
                  ...entry,
                  admn: String(admn),
                  id: String(entryId)
                }
              });
            }
          });
        }
      });
    }

    // 6. Attendance Collection (Composite Doc: {admn}_{month})
    if (parsedData.attendance) {
      log("Analyzing Attendance data...");
      Object.entries(parsedData.attendance).forEach(([admn, months]) => {
        if (months && typeof months === 'object') {
          Object.entries(months).forEach(([monthName, days]) => {
            if (days && typeof days === 'object') {
              operations.push({
                collection: "attendance",
                id: `${admn}_${monthName}`,
                data: {
                  admn: String(admn),
                  month: monthName,
                  days: days
                }
              });
            }
          });
        }
      });
    }

    // 7. Daily Claims
    if (parsedData.daily_claims) {
      log("Analyzing Daily Claims data...");
      Object.entries(parsedData.daily_claims).forEach(([uid, claims]) => {
        if (claims && typeof claims === 'object') {
          operations.push({
            collection: "daily_claims",
            id: uid,
            data: {
              userId: String(uid),
              claims: claims
            }
          });
        }
      });
    }

    // 8. Expenses
    if (parsedData.expenses) {
      log("Analyzing Expenses records...");
      Object.entries(parsedData.expenses).forEach(([key, exp]) => {
        if (exp && typeof exp === 'object') {
          // If nested under Month folder
          if (["September", "October", "August", "June", "July"].includes(key)) {
            Object.entries(exp).forEach(([expId, item]) => {
              operations.push({
                collection: "expenses",
                id: `${key}_${expId}`,
                data: { ...item, id: expId, month: key }
              });
            });
          } else {
            operations.push({
              collection: "expenses",
              id: key,
              data: exp
            });
          }
        }
      });
    }

    // 9. Timetable
    if (parsedData.timetable) {
      log("Analyzing Timetable schedules...");
      Object.entries(parsedData.timetable).forEach(([cls, schedule]) => {
        operations.push({
          collection: "timetable",
          id: String(cls).replace(/class\s*/i, "").trim(),
          data: {
            class: String(cls).replace(/class\s*/i, "").trim(),
            schedule: schedule
          }
        });
      });
    }

    // 10. Online Tests
    if (parsedData.online_tests) {
      log("Analyzing Online Tests...");
      Object.entries(parsedData.online_tests).forEach(([cls, tests]) => {
        if (tests && typeof tests === 'object') {
          Object.entries(tests).forEach(([tId, tObj]) => {
            operations.push({
              collection: "online_tests",
              id: tId,
              data: { ...tObj, id: tId, class: String(cls) }
            });
          });
        }
      });
    }

    log(`Total structured documents ready for Firestore: <b>${operations.length}</b>`);
    log("Pushing batches to Firestore...");

    try {
      await commitBatchOperations(operations);

      // Trigger RTDB Version Bump so clients know new data exists
      await set(ref(rtdb, "sync_triggers/version"), Date.now().toString());

      log("🎉 <b>ALL DATA MIGRATED & STANDARDIZED SUCCESSFULLY!</b>");
      log("Ab aap apni app refresh karke test kar sakte hain.");
    } catch (err) {
      log(`❌ Migration error: ${err.message}`);
    } finally {
      startBtn.disabled = false;
    }
  });
</script>

</body>
</html>
