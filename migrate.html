<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RTDB Direct REST Purge Tool</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0b1329; color: #f8fafc; padding: 18px; margin: 0; }
    .container { max-width: 680px; margin: auto; background: #131d36; border-radius: 16px; padding: 20px; border: 1px solid #1e293b; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    h1 { color: #38bdf8; font-size: 20px; margin-top: 0; }
    p { color: #94a3b8; font-size: 13px; line-height: 1.5; margin-bottom: 16px; }
    .btn-all { background: #dc2626; color: white; border: none; padding: 14px 20px; border-radius: 12px; font-weight: 800; font-size: 14px; cursor: pointer; width: 100%; margin-bottom: 18px; transition: opacity 0.2s; }
    .btn-all:hover { opacity: 0.9; }
    .btn-all:disabled { background: #475569; cursor: not-allowed; }
    .node-list { display: flex; flex-direction: column; gap: 8px; max-height: 280px; overflow-y: auto; padding-right: 6px; }
    .node-row { display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 10px 14px; border-radius: 10px; border: 1px solid #334155; }
    .node-name { font-family: monospace; font-size: 13px; font-weight: 700; color: #f1f5f9; }
    .node-status { font-size: 11px; font-weight: 700; margin-right: 10px; }
    .btn-del-single { background: #ea580c; color: white; border: none; padding: 6px 12px; border-radius: 6px; font-size: 11px; font-weight: 800; cursor: pointer; }
    .btn-del-single:disabled { background: #475569; cursor: not-allowed; }
    #logBox { background: #000; color: #4ade80; padding: 12px; border-radius: 10px; font-family: monospace; font-size: 11px; height: 180px; overflow-y: auto; white-space: pre-wrap; margin-top: 16px; border: 1px solid #1e293b; }
  </style>
</head>
<body>
  <div class="container">
    <h1>⚡ RTDB Instant Cloud Purge</h1>
    <p>Aapke Realtime Database se sirf wahi 13 nodes delete hongi jo Firestore mein ja chuki hain. Baaqi light data (muster, notifications, timetable wagera) safe rahega.</p>

    <button id="btnCleanAll" class="btn-all" onclick="purgeAllNodes()">🚀 1-Click: Delete All 13 Unused Nodes</button>

    <div style="font-size: 12px; font-weight: 800; color: #94a3b8; margin-bottom: 8px;">Ya ek-ek karke delete karein:</div>
    <div class="node-list" id="nodesContainer"></div>

    <div id="logBox">Console ready. Click karke delete karein...</div>
  </div>

  <script>
    const RTDB_BASE = "https://mm-islamic-erp-default-rtdb.firebaseio.com";

    // Screenshot ke mutabiq wahi 13 nodes jo Firestore me shift ho chuki hain
    const TARGET_NODES = [
      "attendance",
      "expenses",
      "fees",
      "fees_entries",
      "fees_matrix",
      "fees_records",
      "points",
      "student_test_attempts",
      "students",
      "teachers",
      "tests",
      "test_attempts",
      "users"
    ];

    function log(msg, isErr = false) {
      const box = document.getElementById("logBox");
      box.textContent += "\n" + (isErr ? "❌ " : "👉 ") + msg;
      box.scrollTop = box.scrollHeight;
    }

    function renderRows() {
      const container = document.getElementById("nodesContainer");
      container.innerHTML = "";
      TARGET_NODES.forEach(node => {
        const row = document.createElement("div");
        row.className = "node-row";
        row.id = `row_${node}`;
        row.innerHTML = `
          <span class="node-name">/${node}</span>
          <div style="display:flex; align-items:center;">
            <span class="node-status" id="status_${node}" style="color:#94a3b8;">Pending</span>
            <button class="btn-del-single" id="btn_${node}" onclick="deleteSingleNode('${node}')">Delete</button>
          </div>
        `;
        container.appendChild(row);
      });
    }

    async function deleteNodeFromCloud(node) {
      const statusEl = document.getElementById(`status_${node}`);
      const btn = document.getElementById(`btn_${node}`);
      if (statusEl) { statusEl.innerText = "Deleting ⏳"; statusEl.style.color = "#fbbf24"; }
      if (btn) btn.disabled = true;

      log(`Deleting /${node}...`);

      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 12000); // 12s timeout

      try {
        const res = await fetch(`${RTDB_BASE}/${node}.json`, {
          method: "DELETE",
          signal: controller.signal
        });
        clearTimeout(timeoutId);

        if (res.ok) {
          log(`✔ /${node} delete ho gaya.`);
          if (statusEl) { statusEl.innerText = "Deleted ✔"; statusEl.style.color = "#4ade80"; }
          return true;
        } else {
          log(`/${node} fail hua. Status: ${res.status}`, true);
          if (statusEl) { statusEl.innerText = "Failed ❌"; statusEl.style.color = "#f87171"; }
          if (btn) btn.disabled = false;
          return false;
        }
      } catch (err) {
        clearTimeout(timeoutId);
        log(`Error on /${node}: ${err.message}`, true);
        if (statusEl) { statusEl.innerText = "Error ❌"; statusEl.style.color = "#f87171"; }
        if (btn) btn.disabled = false;
        return false;
      }
    }

    async function deleteSingleNode(node) {
      await deleteNodeFromCloud(node);
    }

    async function purgeAllNodes() {
      if (!confirm("Are you sure? RTDB se yeh 13 purani nodes delete ho jayengi.")) return;

      const btnAll = document.getElementById("btnCleanAll");
      btnAll.disabled = true;
      log("\n==============================================");
      log("Cloud REST Purge shuru ho raha hai...");

      for (const node of TARGET_NODES) {
        await deleteNodeFromCloud(node);
      }

      log("\n🎉 Purge Process Complete! RTDB ab bilkul light ho chuka hai.");
      btnAll.disabled = false;
    }

    renderRows();
  </script>
</body>
</html>
