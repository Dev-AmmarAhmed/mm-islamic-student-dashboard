<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RTDB One-Click Purge</title>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0b1329; color: #f8fafc; padding: 24px; margin: 0; }
    .container { max-width: 700px; margin: auto; background: #131d36; border-radius: 16px; padding: 24px; border: 1px solid #1e293b; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    h1 { color: #ef4444; font-size: 20px; margin-top: 0; }
    p { color: #94a3b8; font-size: 13px; line-height: 1.5; }
    button { background: #dc2626; color: white; border: none; padding: 14px 20px; border-radius: 10px; font-weight: 800; font-size: 14px; cursor: pointer; width: 100%; margin-top: 10px; }
    button:disabled { background: #475569; cursor: not-allowed; }
    #logBox { background: #000; color: #4ade80; padding: 14px; border-radius: 10px; font-family: monospace; font-size: 12px; height: 320px; overflow-y: auto; white-space: pre-wrap; margin-top: 16px; border: 1px solid #1e293b; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🗑️ RTDB One-Click Bloat Purge</h1>
    <p>Isme kisi login ki zaroorat nahi hai. Seedha button dabayein aur 12MB ka purana data RTDB se saaf ho jayega.</p>

    <button id="btnClean" onclick="startDirectPurge()">🚀 Purge All Unused RTDB Nodes Now</button>

    <div id="logBox">Ready. 'Purge All Unused RTDB Nodes Now' dabayein...</div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBHpbgoGs7HFQ3-1tBn9BpGT4YYDaKkZB8",
      authDomain: "mm-islamic-erp.firebaseapp.com",
      databaseURL: "https://mm-islamic-erp-default-rtdb.firebaseio.com",
      projectId: "mm-islamic-erp",
      storageBucket: "mm-islamic-erp.firebasestorage.app",
      messagingSenderId: "547338314533",
      appId: "1:547338314533:web:3973c2b36ef8b3b01170cc"
    };

    firebase.initializeApp(firebaseConfig);
    const rtdb = firebase.database();

    function log(msg, err = false) {
      const box = document.getElementById("logBox");
      box.textContent += "\n" + (err ? "❌ " : "👉 ") + msg;
      box.scrollTop = box.scrollHeight;
    }

    async function startDirectPurge() {
      if (!confirm("Are you sure? RTDB se purane heavy collections delete ho jayenge.")) return;

      const btn = document.getElementById("btnClean");
      btn.disabled = true;

      const nodesToDelete = [
        "student_photos",
        "teacher_photos",
        "students",
        "teachers",
        "fees_matrix",
        "fees_entries",
        "attendance",
        "tests",
        "test_attempts",
        "expenses"
      ];

      log("\n==================================================");
      log("Purging Unused RTDB Nodes (No Login Mode)...");

      for (const node of nodesToDelete) {
        try {
          log(`Deleting /${node}...`);
          await rtdb.ref(node).remove();
          log(`✔ /${node} deleted successfully.`);
        } catch (e) {
          log(`Error on /${node}: ${e.message}`, true);
        }
      }

      log("\n🎉 Done! Realtime Database ka saara heavy data purge ho chuka hai.");
    }
  </script>
</body>
</html>
