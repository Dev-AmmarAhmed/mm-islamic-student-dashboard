<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AccuEngine - Full Data Migration Console</title>
    <!-- Firebase v10 Compat SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-check-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: #f8fafc; padding: 25px; }
        .card { max-width: 720px; margin: auto; background: #1e293b; border-radius: 12px; padding: 25px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        h2 { color: #38bdf8; margin-top: 0; }
        .status-badge { display: inline-block; padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: bold; margin-bottom: 12px; }
        .status-badge.active { background: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid #16a34a; }
        .status-badge.error { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid #dc2626; }
        button { background: #0288d1; color: white; border: none; padding: 12px 24px; font-size: 15px; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.2s; margin-right: 10px; margin-top: 6px; }
        button:hover { background: #0369a1; }
        button:disabled { background: #475569; cursor: not-allowed; }
        #logs { margin-top: 20px; background: #000; color: #4ade80; padding: 15px; border-radius: 8px; font-family: monospace; font-size: 13px; height: 340px; overflow-y: auto; white-space: pre-wrap; line-height: 1.5; }
    </style>
</head>
<body>
    <div class="card">
        <h2>AccuEngine Full Migration Console</h2>
        <div id="appCheckBadge" class="status-badge">App Check Status: Initializing...</div>
        <p>Yeh script Realtime Database se <b>Fees Matrix, Fees Entries, Attendance, Offline Tests & Online Tests</b> ko Firestore collections mein transfer karega.</p>
        
        <button id="startAllBtn" onclick="runCompleteMigration()">🚀 Migrate All Data (Fees + Attend + Tests)</button>
        
        <div id="logs">Console ready...</div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBHpbgoGs7HFQ3-1tBn9BpGT4YYDaKkZB8",
            authDomain: "mm-islamic-erp.firebaseapp.com",
            databaseURL: "https://mm-islamic-erp-default-rtdb.firebaseio.com",
            projectId: "mm-islamic-erp",
            storageBucket: "mm-islamic-erp.firebasestorage.app",
            messagingSenderId: "547338314533",
            appId: "1:547338314533:web:3973c2b36ef8b3b01170cc"
        };

        const app = firebase.initializeApp(firebaseConfig);
        const rtdb = firebase.database();
        const firestore = firebase.firestore();
        const auth = firebase.auth();

        function log(msg, isError = false) {
            const box = document.getElementById("logs");
            const prefix = isError ? "❌ " : "👉 ";
            box.textContent += "\n" + prefix + msg;
            box.scrollTop = box.scrollHeight;
        }

        try {
            const appCheck = firebase.appCheck();
            appCheck.activate(
                new firebase.appCheck.ReCaptchaEnterpriseProvider('6LefZbUtAAAAADOa8KBfn1qywMly7Ky2-UlX6zxW'),
                true
            );
            document.getElementById("appCheckBadge").className = "status-badge active";
            document.getElementById("appCheckBadge").innerText = "✔ App Check Active";
            log("[App Check] reCAPTCHA Enterprise ready.");
        } catch (err) {
            document.getElementById("appCheckBadge").className = "status-badge error";
            document.getElementById("appCheckBadge").innerText = "⚠ App Check Warning";
            log("[App Check] " + err.message, true);
        }

        // Batch helper: Har 400 operations ke baad auto commit karega
        class FirestoreBatchWriter {
            constructor(db) {
                this.db = db;
                this.batch = db.batch();
                this.count = 0;
                this.total = 0;
            }

            async set(docRef, data, options = { merge: true }) {
                this.batch.set(docRef, data, options);
                this.count++;
                this.total++;
                if (this.count >= 380) {
                    await this.batch.commit();
                    log(`    [Batch] ${this.total} records committed to Firestore...`);
                    this.batch = this.db.batch();
                    this.count = 0;
                }
            }

                        async commit() {
                if (this.count > 0) {
                    await this.batch.commit();
                    log(`    [Batch] Final ${this.total} records committed.`);
                    this.count = 0;
                    this.batch = this.db.batch(); // Naye section ke liye fresh batch tayar
                }
            }

        }

        async function runCompleteMigration() {
            const btn = document.getElementById("startAllBtn");
            btn.disabled = true;
            log("\n============================================");
            log("[AccuEngine] Master Migration shuru ho rahi hai...");

            try {
                if (!auth.currentUser) {
                    await auth.signInAnonymously();
                    log("[Auth] Security token verified.");
                }

                const writer = new FirestoreBatchWriter(firestore);

                // ----------------------------------------------------
                // 1. FEES MATRIX MIGRATION
                // ----------------------------------------------------
                log("\n[1/5] Reading /fees_matrix from RTDB...");
                const snapMatrix = await rtdb.ref("fees_matrix").once("value");
                const feesMatrix = snapMatrix.val() || {};
                const matrixKeys = Object.keys(feesMatrix);
                log(`Found ${matrixKeys.length} students with fee matrix records.`);

                for (const admn of matrixKeys) {
                    const record = feesMatrix[admn];
                    const docRef = firestore.collection("fees_matrix").doc(String(admn));
                    await writer.set(docRef, {
                        admn: String(admn),
                        matrix: record,
                        updatedAt: new Date().toISOString()
                    });
                }
                await writer.commit();
                log("✔ Fees Matrix successfully shifted to Firestore.");

                // ----------------------------------------------------
                // 2. FEES ENTRIES (RECEIPTS / LOGS) MIGRATION
                // ----------------------------------------------------
                log("\n[2/5] Reading /fees_entries from RTDB...");
                const snapEntries = await rtdb.ref("fees_entries").once("value");
                const feesEntries = snapEntries.val() || {};
                let totalEntriesCount = 0;

                for (const admn of Object.keys(feesEntries)) {
                    const studentEntries = feesEntries[admn] || {};
                    for (const entryId of Object.keys(studentEntries)) {
                        const entryData = studentEntries[entryId];
                        const docRef = firestore.collection("fees_entries").doc(`${admn}_${entryId}`);
                        await writer.set(docRef, {
                            ...entryData,
                            admn: String(admn),
                            entryId: String(entryId)
                        });
                        totalEntriesCount++;
                    }
                }
                await writer.commit();
                log(`✔ ${totalEntriesCount} Fee entries & receipts shifted to Firestore.`);

                // ----------------------------------------------------
                // 3. ATTENDANCE RECORDS MIGRATION
                // ----------------------------------------------------
                log("\n[3/5] Reading /attendance from RTDB...");
                const snapAtt = await rtdb.ref("attendance").once("value");
                const attData = snapAtt.val() || {};
                let totalAttMonths = 0;

                for (const admn of Object.keys(attData)) {
                    const monthsObj = attData[admn] || {};
                    for (const month of Object.keys(monthsObj)) {
                        const monthDays = monthsObj[month];
                        const docRef = firestore.collection("attendance").doc(`${admn}_${month}`);
                        await writer.set(docRef, {
                            admn: String(admn),
                            month: String(month),
                            days: monthDays,
                            updatedAt: new Date().toISOString()
                        });
                        totalAttMonths++;
                    }
                }
                await writer.commit();
                log(`✔ ${totalAttMonths} Student attendance monthly records shifted to Firestore.`);

                // ----------------------------------------------------
                // 4. OFFLINE TESTS (MARKS & POINTS) MIGRATION
                // ----------------------------------------------------
                log("\n[4/5] Reading /tests (Offline Test Marks) from RTDB...");
                const snapTests = await rtdb.ref("tests").once("value");
                const testsData = snapTests.val() || {};
                let totalTestsCount = 0;

                for (const admn of Object.keys(testsData)) {
                    const studentTests = testsData[admn] || {};
                    for (const testId of Object.keys(studentTests)) {
                        const tObj = studentTests[testId];
                        const docRef = firestore.collection("tests").doc(`${admn}_${testId}`);
                        await writer.set(docRef, {
                            ...tObj,
                            admn: String(admn),
                            testId: String(testId)
                        });
                        totalTestsCount++;
                    }
                }
                await writer.commit();
                log(`✔ ${totalTestsCount} Test score records shifted to Firestore.`);

                // ----------------------------------------------------
                // 5. ONLINE TESTS & ATTEMPTS MIGRATION
                // ----------------------------------------------------
                log("\n[5/5] Reading /online_tests & /test_attempts from RTDB...");
                const snapOnline = await rtdb.ref("online_tests").once("value");
                const onlineData = snapOnline.val() || {};
                let onlineTestCount = 0;

                for (const clsKey of Object.keys(onlineData)) {
                    const classTests = onlineData[clsKey] || {};
                    for (const testId of Object.keys(classTests)) {
                        const testObj = classTests[testId];
                        const docRef = firestore.collection("online_tests").doc(String(testId));
                        await writer.set(docRef, {
                            ...testObj,
                            class: String(clsKey),
                            id: String(testId)
                        });
                        onlineTestCount++;
                    }
                }
                await writer.commit();
                log(`✔ ${onlineTestCount} Online Tests shifted to Firestore.`);

                // Attempts Migration
                const snapAttempts = await rtdb.ref("test_attempts").once("value");
                const attemptsData = snapAttempts.val() || {};
                let attemptsCount = 0;

                for (const testId of Object.keys(attemptsData)) {
                    const studentAttempts = attemptsData[testId] || {};
                    for (const admn of Object.keys(studentAttempts)) {
                        const attObj = studentAttempts[admn];
                        const docRef = firestore.collection("test_attempts").doc(`${testId}_${admn}`);
                        await writer.set(docRef, {
                            ...attObj,
                            testId: String(testId),
                            admn: String(admn)
                        });
                        attemptsCount++;
                    }
                }
                await writer.commit();
                log(`✔ ${attemptsCount} Student online test attempts shifted to Firestore.`);

                log("\n🎉 [ALL COMPLETED] Mubarak ho! Saara data (Fees, Attendance, Offline & Online Tests) Firestore mein migrate ho chuka hai!");
            } catch (err) {
                log("\n[MIGRATION ERROR] " + err.message, true);
                btn.disabled = false;
            }
        }

        async function migrateStudentsAndTeachers() {
    const btn = document.getElementById("startAllBtn");
    btn.disabled = true;
    log("\n[AccuEngine] Migrating Students & Teachers to Firestore...");

    const writer = new FirestoreBatchWriter(firestore);

    // 1. Students Bio-data
    const snapStudents = await rtdb.ref("students").once("value");
    const studentsData = snapStudents.val() || {};
    const sKeys = Object.keys(studentsData);
    log(`Found ${sKeys.length} students. Transferring to Firestore...`);

    for (const admn of sKeys) {
        const sDocRef = firestore.collection("students").doc(String(admn));
        await writer.set(sDocRef, studentsData[admn]);
    }
    await writer.commit();
    log(`✔ ${sKeys.length} Students profiles shifted to Firestore.`);

    // 2. Teachers Profiles
    const snapTeachers = await rtdb.ref("teachers").once("value");
    const teachersData = snapTeachers.val() || {};
    const tKeys = Object.keys(teachersData);
    log(`Found ${tKeys.length} teachers. Transferring to Firestore...`);

    for (const username of tKeys) {
        const tDocRef = firestore.collection("teachers").doc(String(username));
        await writer.set(tDocRef, teachersData[username]);
    }
    await writer.commit();
    log(`✔ ${tKeys.length} Teachers profiles shifted to Firestore.`);

    log("\n🎉 [DONE] Students & Teachers are now 100% in Firestore!");
    btn.disabled = false;
        }
        
    </script>
</body>
</html>
