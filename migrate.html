<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AccuEngine - Master Migration Console</title>
    <!-- Firebase v10 Compat SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-check-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: #f8fafc; padding: 25px; }
        .card { max-width: 720px; margin: auto; background: #1e293b; border-radius: 12px; padding: 25px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        h2 { color: #38bdf8; margin-top: 0; }
        .status-badge { display: inline-block; padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: bold; margin-bottom: 12px; }
        .status-badge.active { background: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid #16a34a; }
        .status-badge.error { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid #dc2626; }
        button { background: #0288d1; color: white; border: none; padding: 12px 20px; font-size: 14px; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.2s; margin-right: 10px; margin-top: 8px; }
        button:hover { opacity: 0.9; }
        button:disabled { background: #475569; cursor: not-allowed; }
        #logs { margin-top: 20px; background: #000; color: #4ade80; padding: 15px; border-radius: 8px; font-family: monospace; font-size: 13px; height: 320px; overflow-y: auto; white-space: pre-wrap; line-height: 1.5; }
    </style>
</head>
<body>
    <div class="card">
        <h2>AccuEngine Master Migration Console</h2>
        <div id="appCheckBadge" class="status-badge">App Check Status: Initializing...</div>
        <p>Students, Teachers aur missing collections ko Firestore mein shift karein:</p>
        
        <button id="btnSyncProfiles" style="background: #16a34a;" onclick="migrateMissingProfilesAndClaims()">👥 1. Sync Students, Teachers & Claims</button>
        <button id="btnSyncAll" style="background: #0288d1;" onclick="runCompleteMigration()">🚀 2. Re-Sync Fees, Attend & Tests</button>

        <div id="logs">Console ready...</div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBHpbgoGs7HFQ3-1tBn9BpGT4YYDaKkZB8",
            authDomain: "mm-islamic-erp.firebaseapp.com",
            databaseURL: "https://mm-islamic-erp-default-rtdb.firebaseio.com",
            projectId: "mm-islamic-erp",
            storageBucket: "mm-islamic-erp.firebasestorage.app",
            messagingSenderId: "547338314533",
            appId: "1:547338314533:web:3973c2b36ef8b3b01170cc"
        };

        const app = firebase.initializeApp(firebaseConfig);
        const rtdb = firebase.database();
        const firestore = firebase.firestore();
        const auth = firebase.auth();

        function log(msg, isError = false) {
            const box = document.getElementById("logs");
            const prefix = isError ? "❌ " : "👉 ";
            box.textContent += "\n" + prefix + msg;
            box.scrollTop = box.scrollHeight;
        }

        try {
            const appCheck = firebase.appCheck();
            appCheck.activate(
                new firebase.appCheck.ReCaptchaEnterpriseProvider('6LefZbUtAAAAADOa8KBfn1qywMly7Ky2-UlX6zxW'),
                true
            );
            document.getElementById("appCheckBadge").className = "status-badge active";
            document.getElementById("appCheckBadge").innerText = "✔ App Check Active";
            log("[App Check] reCAPTCHA Enterprise provider active.");
        } catch (err) {
            document.getElementById("appCheckBadge").className = "status-badge error";
            document.getElementById("appCheckBadge").innerText = "⚠ App Check Warning";
            log("[App Check] " + err.message, true);
        }

        class FirestoreBatchWriter {
            constructor(db) {
                this.db = db;
                this.batch = db.batch();
                this.count = 0;
                this.total = 0;
            }

            async set(docRef, data, options = { merge: true }) {
                this.batch.set(docRef, data, options);
                this.count++;
                this.total++;
                if (this.count >= 380) {
                    await this.batch.commit();
                    log(`    [Batch] ${this.total} items written...`);
                    this.batch = this.db.batch();
                    this.count = 0;
                }
            }

            async commit() {
                if (this.count > 0) {
                    await this.batch.commit();
                    log(`    [Batch] Final ${this.total} items saved.`);
                    this.count = 0;
                    this.batch = this.db.batch();
                }
            }
        }

        async function ensureAuth() {
            if (!auth.currentUser) {
                await auth.signInAnonymously();
                log("[Auth] Security session verified.");
            }
        }

        async function migrateMissingProfilesAndClaims() {
            const btn = document.getElementById("btnSyncProfiles");
            btn.disabled = true;
            log("\n============================================");
            log("[AccuEngine] Students, Teachers aur Claims sync ho rahe hain...");

            try {
                await ensureAuth();
                const writer = new FirestoreBatchWriter(firestore);

                // 1. STUDENTS
                log("[1/3] Reading /students from RTDB...");
                const snapStudents = await rtdb.ref("students").once("value");
                const students = snapStudents.val() || {};
                const sKeys = Object.keys(students);
                log(`Found ${sKeys.length} students. Transferring...`);

                for (const admn of sKeys) {
                    const docRef = firestore.collection("students").doc(String(admn));
                    await writer.set(docRef, { ...students[admn], admn: String(admn) });
                }
                await writer.commit();
                log(`✔ ${sKeys.length} Students Firestore mein sync ho gaye.`);

                // 2. TEACHERS
                log("\n[2/3] Reading /teachers from RTDB...");
                const snapTeachers = await rtdb.ref("teachers").once("value");
                const teachers = snapTeachers.val() || {};
                const tKeys = Object.keys(teachers);
                log(`Found ${tKeys.length} teachers. Transferring...`);

                for (const username of tKeys) {
                    const docRef = firestore.collection("teachers").doc(String(username));
                    await writer.set(docRef, { ...teachers[username], username: String(username) });
                }
                await writer.commit();
                log(`✔ ${tKeys.length} Teachers Firestore mein sync ho gaye.`);

                // 3. DAILY CLAIMS (Taake unlimited points ka loop khatam ho)
                log("\n[3/3] Reading /daily_claims from RTDB...");
                const snapClaims = await rtdb.ref("daily_claims").once("value");
                const claims = snapClaims.val() || {};
                let claimCount = 0;

                for (const admn of Object.keys(claims)) {
                    const docRef = firestore.collection("daily_claims").doc(String(admn));
                    await writer.set(docRef, { claims: claims[admn] });
                    claimCount++;
                }
                await writer.commit();
                log(`✔ ${claimCount} Students ke daily claims Firestore mein sync ho gaye.`);

                log("\n🎉 [SUCCESS] Students, Teachers aur Claims 100% Firestore mein sync ho chuke hain!");
                btn.disabled = false;
            } catch (err) {
                log("[ERROR] " + err.message, true);
                btn.disabled = false;
            }
        }

        async function runCompleteMigration() {
            const btn = document.getElementById("btnSyncAll");
            btn.disabled = true;
            log("\n============================================");
            log("[AccuEngine] Fees, Attendance & Tests sync ho rahe hain...");

            try {
                await ensureAuth();
                const writer = new FirestoreBatchWriter(firestore);

                // Fees Matrix
                log("[1/3] Syncing Fees Matrix...");
                const snapMatrix = await rtdb.ref("fees_matrix").once("value");
                const matrix = snapMatrix.val() || {};
                for (const admn of Object.keys(matrix)) {
                    await writer.set(firestore.collection("fees_matrix").doc(String(admn)), {
                        admn: String(admn), matrix: matrix[admn]
                    });
                }
                await writer.commit();

                // Attendance
                log("[2/3] Syncing Attendance...");
                const snapAtt = await rtdb.ref("attendance").once("value");
                const att = snapAtt.val() || {};
                for (const admn of Object.keys(att)) {
                    for (const m of Object.keys(att[admn])) {
                        await writer.set(firestore.collection("attendance").doc(`${admn}_${m}`), {
                            admn: String(admn), month: String(m), days: att[admn][m]
                        });
                    }
                }
                await writer.commit();

                // Tests
                log("[3/3] Syncing Tests...");
                const snapTests = await rtdb.ref("tests").once("value");
                const tests = snapTests.val() || {};
                for (const admn of Object.keys(tests)) {
                    for (const tid of Object.keys(tests[admn])) {
                        await writer.set(firestore.collection("tests").doc(`${admn}_${tid}`), {
                            ...tests[admn][tid], admn: String(admn), testId: String(tid)
                        });
                    }
                }
                await writer.commit();

                log("\n🎉 [SUCCESS] Fees, Attendance aur Tests Firestore mein verified!");
                btn.disabled = false;
            } catch (err) {
                log("[ERROR] " + err.message, true);
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
