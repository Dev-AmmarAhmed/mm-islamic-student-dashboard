<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>M.M ISLAMIC ERP - Database Migration Engine</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    }
    body {
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .migration-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 20px;
      padding: 30px;
      width: 100%;
      max-width: 680px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }
    .header-title {
      font-size: 20px;
      font-weight: 900;
      color: #38bdf8;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }
    .header-subtitle {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 24px;
    }
    .file-input-wrapper {
      border: 2px dashed #38bdf8;
      border-radius: 14px;
      padding: 26px;
      text-align: center;
      background: rgba(56, 189, 248, 0.03);
      cursor: pointer;
      margin-bottom: 20px;
      transition: all 0.2s ease;
    }
    .file-input-wrapper:hover {
      background: rgba(56, 189, 248, 0.08);
    }
    input[type="file"] {
      display: none;
    }
    .btn-action {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: transform 0.15s ease;
      background: linear-gradient(135deg, #0288d1 0%, #01579b 100%);
      color: white;
      box-shadow: 0 4px 14px rgba(2, 136, 209, 0.4);
      margin-bottom: 16px;
    }
    .btn-action:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      box-shadow: none;
    }
    .progress-bar-container {
      width: 100%;
      height: 10px;
      background: #334155;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 16px;
      display: none;
    }
    .progress-bar-fill {
      width: 0%;
      height: 100%;
      background: #10b981;
      transition: width 0.25s ease;
    }
    .console-terminal {
      background: #020617;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 16px;
      font-family: monospace;
      font-size: 12px;
      color: #38bdf8;
      max-height: 280px;
      overflow-y: auto;
      white-space: pre-wrap;
    }
    .log-success { color: #4ade80; }
    .log-warn { color: #f59e0b; }
    .log-error { color: #ef4444; }
  </style>
</head>
<body>

  <div class="migration-card">
    <div class="header-title">Database Migration Utility</div>
    <div class="header-subtitle">Shift Realtime Database JSON Export into Cloud Firestore with Wipe & Batch Write.</div>

    <label for="jsonFileInput">
      <div class="file-input-wrapper" id="dropZone">
        <div style="font-size: 32px; margin-bottom: 8px;">📁</div>
        <div id="fileSelectLabel" style="font-size: 14px; font-weight: 700; color: #f8fafc;">Click to Select RTDB Export JSON File</div>
        <div style="font-size: 11px; color: #64748b; margin-top: 4px;">mm-islamic-erp-default-rtdb-export.json</div>
      </div>
    </label>
    <input type="file" id="jsonFileInput" accept=".json">

    <div class="progress-bar-container" id="progressBarBox">
      <div class="progress-bar-fill" id="progressBar"></div>
    </div>

    <button id="startMigrateBtn" class="btn-action" disabled>🚀 Wipe Old Data & Start Migration</button>

    <div class="console-terminal" id="terminalLog">System Ready. Please select the JSON backup file to begin.</div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, collection, getDocs, deleteDoc, writeBatch } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBHpbgoGs7HFQ3-1tBn9BpGT4YYDaKkZB8",
      authDomain: "mm-islamic-erp.firebaseapp.com",
      databaseURL: "https://mm-islamic-erp-default-rtdb.firebaseio.com",
      projectId: "mm-islamic-erp",
      storageBucket: "mm-islamic-erp.firebasestorage.app",
      messagingSenderId: "547338314533",
      appId: "1:547338314533:web:3973c2b36ef8b3b01170cc"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const TARGET_COLLECTIONS = [
      "app_settings",
      "auth_sessions",
      "daily_claims",
      "email_lookup",
      "enabled_syllabus",
      "expenses",
      "fees",
      "fees_entries",
      "fees_matrix",
      "attendance",
      "students",
      "users",
      "teachers"
    ];

    let rawJsonData = null;
    const terminal = document.getElementById("terminalLog");
    const progressBox = document.getElementById("progressBarBox");
    const progressBar = document.getElementById("progressBar");
    const startBtn = document.getElementById("startMigrateBtn");
    const fileLabel = document.getElementById("fileSelectLabel");

    function log(msg, type = "normal") {
      const line = document.createElement("div");
      if (type === "success") line.className = "log-success";
      if (type === "warn") line.className = "log-warn";
      if (type === "error") line.className = "log-error";
      line.innerText = `[${new Date().toLocaleTimeString()}] ${msg}`;
      terminal.appendChild(line);
      terminal.scrollTop = terminal.scrollHeight;
    }

    document.getElementById("jsonFileInput").addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;

      fileLabel.innerText = `Selected: ${file.name} (${(file.size / 1024).toFixed(1)} KB)`;
      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          rawJsonData = JSON.parse(event.target.result);
          log("JSON file parsed successfully.", "success");
          startBtn.disabled = false;
        } catch (err) {
          log("JSON parsing error: " + err.message, "error");
          startBtn.disabled = true;
        }
      };
      reader.readAsText(file);
    });

    async function purgeCollections() {
      log("Purging old collections from Firestore...", "warn");
      for (const colName of TARGET_COLLECTIONS) {
        const colRef = collection(db, colName);
        const snapshot = await getDocs(colRef);
        if (!snapshot.empty) {
          let batch = writeBatch(db);
          let count = 0;
          for (const docSnap of snapshot.docs) {
            batch.delete(docSnap.ref);
            count++;
            if (count % 450 === 0) {
              await batch.commit();
              batch = writeBatch(db);
            }
          }
          await batch.commit();
          log(`Purged collection: ${colName} (${count} documents removed).`);
        }
      }
      log("All target collections cleared.", "success");
    }

    startBtn.addEventListener("click", async () => {
      if (!rawJsonData) return;
      startBtn.disabled = true;
      progressBox.style.display = "block";
      progressBar.style.width = "5%";

      try {
        log("Authenticating with Firebase...", "warn");
        await signInAnonymously(auth);
        log("Authenticated successfully.", "success");

        // 1. Purge
        await purgeCollections();
        progressBar.style.width = "30%";

        // 2. Transform and Batch Write
        log("Starting Firestore migration batch write...", "warn");
        const keys = Object.keys(rawJsonData);
        let batch = writeBatch(db);
        let opCount = 0;
        let totalDocsCommitted = 0;

                // Helper function to deeply sanitize objects and remove undefined / invalid entities
        function sanitizeForFirestore(obj) {
          if (obj === undefined) return null;
          if (obj === null || typeof obj !== "object") return obj;

          if (Array.isArray(obj)) {
            return obj
              .filter(item => item !== undefined)
              .map(item => sanitizeForFirestore(item));
          }

          const cleanObj = {};
          for (const [key, val] of Object.entries(obj)) {
            if (val !== undefined) {
              // Sanitize key name to prevent invalid Firestore characters
              const cleanKey = String(key).replace(/\//g, "_");
              cleanObj[cleanKey] = sanitizeForFirestore(val);
            }
          }
          return cleanObj;
        }

        for (const rootKey of keys) {
          const rootData = rawJsonData[rootKey];
          if (!rootData || typeof rootData !== "object") continue;

          // Handle special nested collections: expenses
          if (rootKey === "expenses") {
            for (const [monthOrId, itemPayload] of Object.entries(rootData)) {
              if (itemPayload && typeof itemPayload === "object") {
                // If it is a month container containing timestamp IDs like 1789612551653
                const hasTimestampSubDocs = Object.keys(itemPayload).some(k => !isNaN(Number(k)) && k.length > 8);
                if (hasTimestampSubDocs) {
                  for (const [tId, expRecord] of Object.entries(itemPayload)) {
                    const docRef = doc(db, "expenses", `${monthOrId}_${tId}`);
                    const cleanPayload = sanitizeForFirestore(expRecord) || {};
                    cleanPayload.month = monthOrId;
                    cleanPayload.expenseId = String(tId);

                    batch.set(docRef, cleanPayload, { merge: true });
                    opCount++;
                    totalDocsCommitted++;

                    if (opCount >= 450) {
                      await batch.commit();
                      batch = writeBatch(db);
                      opCount = 0;
                      log(`Committed chunk of 450 documents (expenses)...`);
                    }
                  }
                } else {
                  const docRef = doc(db, "expenses", String(monthOrId));
                  const cleanPayload = sanitizeForFirestore(itemPayload) || {};
                  batch.set(docRef, cleanPayload, { merge: true });
                  opCount++;
                  totalDocsCommitted++;
                  if (opCount >= 450) {
                    await batch.commit();
                    batch = writeBatch(db);
                    opCount = 0;
                    log(`Committed chunk of 450 documents...`);
                  }
                }
              }
            }
            continue;
          }

          // Default processing for all other collections
          for (const [docId, payload] of Object.entries(rootData)) {
            const cleanDocId = String(docId).replace(/\//g, "_");
            const docRef = doc(db, rootKey, cleanDocId);
            const cleanPayload = sanitizeForFirestore(payload);
            const formattedPayload = (typeof cleanPayload === "object" && cleanPayload !== null) ? cleanPayload : { value: cleanPayload };

            batch.set(docRef, formattedPayload, { merge: true });
            opCount++;
            totalDocsCommitted++;

            if (opCount >= 450) {
              await batch.commit();
              batch = writeBatch(db);
              opCount = 0;
              log(`Committed chunk of 450 documents (${rootKey})...`);
            }
          }
        }


        // Commit remainder
        if (opCount > 0) {
          await batch.commit();
        }

        progressBar.style.width = "100%";
        log(`Migration Complete! Total documents written: ${totalDocsCommitted}`, "success");
        alert("✔ Realtime Database to Firestore Migration has completed successfully!");

      } catch (err) {
        log("Migration failed: " + err.message, "error");
        alert("Migration Error: " + err.message);
      } finally {
        startBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
