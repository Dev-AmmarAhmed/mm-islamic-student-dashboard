<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RTDB REST Fast Deleter</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0b1329; color: #f8fafc; padding: 24px; margin: 0; }
    .container { max-width: 680px; margin: auto; background: #131d36; border-radius: 16px; padding: 24px; border: 1px solid #1e293b; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    h1 { color: #38bdf8; font-size: 20px; margin-top: 0; }
    p { color: #94a3b8; font-size: 13px; line-height: 1.5; }
    button { background: #dc2626; color: white; border: none; padding: 14px 20px; border-radius: 10px; font-weight: 800; font-size: 14px; cursor: pointer; width: 100%; margin-top: 10px; transition: opacity 0.2s; }
    button:hover { opacity: 0.9; }
    button:disabled { background: #475569; cursor: not-allowed; }
    #logBox { background: #000; color: #4ade80; padding: 14px; border-radius: 10px; font-family: monospace; font-size: 12px; height: 300px; overflow-y: auto; white-space: pre-wrap; margin-top: 16px; border: 1px solid #1e293b; }
  </style>
</head>
<body>
  <div class="container">
    <h1>⚡ RTDB Instant REST Purge</h1>
    <p>Yeh tool WebSocket load nahi karta, balki HTTP DELETE request ke zariye server se seedha data wipe karta hai.</p>

    <button id="btnClean" onclick="startRestPurge()">🚀 Instant Purge All 10 Nodes</button>

    <div id="logBox">Ready. Click the button to start deletion...</div>
  </div>

  <script>
    const RTDB_BASE = "https://mm-islamic-erp-default-rtdb.firebaseio.com";

    function log(msg, isErr = false) {
      const box = document.getElementById("logBox");
      box.textContent += "\n" + (isErr ? "❌ " : "👉 ") + msg;
      box.scrollTop = box.scrollHeight;
    }

    async function startRestPurge() {
      const btn = document.getElementById("btnClean");
      btn.disabled = true;

      const nodes = [
        "student_photos",
        "teacher_photos",
        "students",
        "teachers",
        "fees_matrix",
        "fees_entries",
        "attendance",
        "tests",
        "test_attempts",
        "expenses"
      ];

      log("Starting REST Purge across 10 nodes...");

      for (const node of nodes) {
        log(`Deleting /${node}...`);
        try {
          const res = await fetch(`${RTDB_BASE}/${node}.json`, {
            method: "DELETE"
          });

          if (res.ok) {
            log(`✔ /${node} successfully deleted!`);
          } else {
            log(`HTTP Error deleting /${node}: Status ${res.status}`, true);
          }
        } catch (e) {
          log(`Network error on /${node}: ${e.message}`, true);
        }
      }

      log("\n🎉 Cleanup complete! Realtime Database ka 12MB space free ho chuka hai.");
    }
  </script>
</body>
</html>
