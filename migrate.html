<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>M.M ISLAMIC ERP - Database Migration Engine</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    }
    body {
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .migration-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 20px;
      padding: 30px;
      width: 100%;
      max-width: 680px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }
    .header-title {
      font-size: 20px;
      font-weight: 900;
      color: #38bdf8;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }
    .header-subtitle {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 24px;
    }
    .file-input-wrapper {
      border: 2px dashed #38bdf8;
      border-radius: 14px;
      padding: 26px;
      text-align: center;
      background: rgba(56, 189, 248, 0.03);
      cursor: pointer;
      margin-bottom: 20px;
      transition: all 0.2s ease;
    }
    .file-input-wrapper:hover {
      background: rgba(56, 189, 248, 0.08);
    }
    input[type="file"] {
      display: none;
    }
    .btn-action {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: transform 0.15s ease;
      background: linear-gradient(135deg, #0288d1 0%, #01579b 100%);
      color: white;
      box-shadow: 0 4px 14px rgba(2, 136, 209, 0.4);
      margin-bottom: 16px;
    }
    .btn-action:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      box-shadow: none;
    }
    .progress-bar-container {
      width: 100%;
      height: 10px;
      background: #334155;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 16px;
      display: none;
    }
    .progress-bar-fill {
      width: 0%;
      height: 100%;
      background: #10b981;
      transition: width 0.25s ease;
    }
    .console-terminal {
      background: #020617;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 16px;
      font-family: monospace;
      font-size: 12px;
      color: #38bdf8;
      max-height: 280px;
      overflow-y: auto;
      white-space: pre-wrap;
    }
    .log-success { color: #4ade80; }
    .log-warn { color: #f59e0b; }
    .log-error { color: #ef4444; }
  </style>
</head>
<body>

  <div class="migration-card">
    <div class="header-title">Database Migration Utility</div>
    <div class="header-subtitle">Shift Realtime Database JSON Export into Cloud Firestore with Wipe & Batch Write.</div>

    <label for="jsonFileInput">
      <div class="file-input-wrapper" id="dropZone">
        <div style="font-size: 32px; margin-bottom: 8px;">📁</div>
        <div id="fileSelectLabel" style="font-size: 14px; font-weight: 700; color: #f8fafc;">Click to Select RTDB Export JSON File</div>
        <div style="font-size: 11px; color: #64748b; margin-top: 4px;">mm-islamic-erp-default-rtdb-export.json</div>
      </div>
    </label>
    <input type="file" id="jsonFileInput" accept=".json">

    <div class="progress-bar-container" id="progressBarBox">
      <div class="progress-bar-fill" id="progressBar"></div>
    </div>

    <button id="startMigrateBtn" class="btn-action" disabled>🚀 Wipe Old Data & Start Migration</button>

    <div class="console-terminal" id="terminalLog">System Ready. Please select the JSON backup file to begin.</div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, collection, getDocs, deleteDoc, writeBatch } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBHpbgoGs7HFQ3-1tBn9BpGT4YYDaKkZB8",
      authDomain: "mm-islamic-erp.firebaseapp.com",
      databaseURL: "https://mm-islamic-erp-default-rtdb.firebaseio.com",
      projectId: "mm-islamic-erp",
      storageBucket: "mm-islamic-erp.firebasestorage.app",
      messagingSenderId: "547338314533",
      appId: "1:547338314533:web:3973c2b36ef8b3b01170cc"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const TARGET_COLLECTIONS = [
      "app_settings",
      "auth_sessions",
      "daily_claims",
      "email_lookup",
      "enabled_syllabus",
      "expenses",
      "fees",
      "fees_entries",
      "fees_matrix",
      "attendance",
      "students",
      "users",
      "teachers",
      "teacher_points_logs",
      "teacher_daily_claims",
      "tests",
      "test_attempts",
      "online_tests",
      "study_material",
      "homework",
      "timetable",
      "leave_applications",
      "teacher_leave_applications",
      "notifications",
      "student_permissions",
      "teacher_permissions",
      "subjects",
      "syllabus_chapters",
      "syllabus_progress"
    ];

    let rawJsonData = null;
    const terminal = document.getElementById("terminalLog");
    const progressBox = document.getElementById("progressBarBox");
    const progressBar = document.getElementById("progressBar");
    const startBtn = document.getElementById("startMigrateBtn");
    const fileLabel = document.getElementById("fileSelectLabel");

    function log(msg, type = "normal") {
      const line = document.createElement("div");
      if (type === "success") line.className = "log-success";
      if (type === "warn") line.className = "log-warn";
      if (type === "error") line.className = "log-error";
      line.innerText = `[${new Date().toLocaleTimeString()}] ${msg}`;
      terminal.appendChild(line);
      terminal.scrollTop = terminal.scrollHeight;
    }

    document.getElementById("jsonFileInput").addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;

      fileLabel.innerText = `Selected: ${file.name} (${(file.size / 1024).toFixed(1)} KB)`;
      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          rawJsonData = JSON.parse(event.target.result);
          log("JSON file parsed successfully.", "success");
          startBtn.disabled = false;
        } catch (err) {
          log("JSON parsing error: " + err.message, "error");
          startBtn.disabled = true;
        }
      };
      reader.readAsText(file);
    });

    async function purgeCollections() {
      log("Purging old collections from Firestore...", "warn");
      for (const colName of TARGET_COLLECTIONS) {
        try {
          const colRef = collection(db, colName);
          const snapshot = await getDocs(colRef);
          if (!snapshot.empty) {
            let batch = writeBatch(db);
            let count = 0;
            for (const docSnap of snapshot.docs) {
              batch.delete(docSnap.ref);
              count++;
              if (count % 400 === 0) {
                await batch.commit();
                batch = writeBatch(db);
              }
            }
            await batch.commit();
            log(`Purged collection: ${colName} (${count} documents removed).`);
          }
        } catch (e) {
          log(`Skipped purge on ${colName}: ${e.message}`, "warn");
        }
      }
      log("All target collections cleared.", "success");
    }

    // Comprehensive Sanitizer: Eliminates invalid nested arrays, undefs & illegal characters
    function sanitizeForFirestore(val, depth = 0) {
      if (val === undefined || val === null) return null;
      if (typeof val !== "object") return val;

      if (Array.isArray(val)) {
        // Firestore prohibits nested arrays or arrays containing complex non-map objects
        return val
          .filter(item => item !== undefined)
          .map(item => {
            if (Array.isArray(item)) {
              return JSON.stringify(item);
            }
            return sanitizeForFirestore(item, depth + 1);
          });
      }

      const cleanObj = {};
      for (const [k, v] of Object.entries(val)) {
        if (v !== undefined) {
          const safeKey = String(k).replace(/[\/\.]/g, "_");
          // If value is a nested array of arrays, stringify it to protect Firestore integrity
          if (Array.isArray(v) && v.some(sub => Array.isArray(sub))) {
            cleanObj[safeKey] = JSON.stringify(v);
          } else {
            cleanObj[safeKey] = sanitizeForFirestore(v, depth + 1);
          }
        }
      }
      return cleanObj;
    }

    startBtn.addEventListener("click", async () => {
      if (!rawJsonData) return;
      startBtn.disabled = true;
      progressBox.style.display = "block";
      progressBar.style.width = "5%";

      try {
        log("Authenticating with Firebase...", "warn");
        await signInAnonymously(auth);
        log("Authenticated successfully.", "success");

        await purgeCollections();
        progressBar.style.width = "25%";

        log("Starting clean Firestore migration...", "warn");
        let batch = writeBatch(db);
        let opCount = 0;
        let totalDocsCommitted = 0;

        const commitBatch = async (label = "") => {
          if (opCount > 0) {
            await batch.commit();
            totalDocsCommitted += opCount;
            log(`Committed chunk of ${opCount} documents ${label}...`);
            batch = writeBatch(db);
            opCount = 0;
            await new Promise(r => setTimeout(r, 60)); // Throttle
          }
        };

        const rootKeys = Object.keys(rawJsonData);
        let processedKeys = 0;

        for (const rootKey of rootKeys) {
          const rootData = rawJsonData[rootKey];
          if (!rootData || typeof rootData !== "object") continue;

          // Special branch 1: Expenses with monthly grouping
          if (rootKey === "expenses") {
            for (const [subGroup, subPayload] of Object.entries(rootData)) {
              if (subPayload && typeof subPayload === "object") {
                const isTimestampBucket = Object.keys(subPayload).some(k => !isNaN(Number(k)) && k.length > 8);
                if (isTimestampBucket) {
                  for (const [tId, expRecord] of Object.entries(subPayload)) {
                    const docRef = doc(db, "expenses", `${subGroup}_${tId}`);
                    const clean = sanitizeForFirestore(expRecord) || {};
                    clean.month = subGroup;
                    clean.id = String(tId);
                    batch.set(docRef, clean, { merge: true });
                    opCount++;
                    if (opCount >= 400) await commitBatch("(expenses)");
                  }
                } else {
                  const docRef = doc(db, "expenses", String(subGroup));
                  batch.set(docRef, sanitizeForFirestore(subPayload) || {}, { merge: true });
                  opCount++;
                  if (opCount >= 400) await commitBatch("(expenses)");
                }
              }
            }
          }
          // Special branch 2: Fees entries nested by student admn
          else if (rootKey === "fees_entries") {
            for (const [admnId, entriesMap] of Object.entries(rootData)) {
              if (entriesMap && typeof entriesMap === "object") {
                for (const [entryId, entryData] of Object.entries(entriesMap)) {
                  const docRef = doc(db, "fees_entries", `${admnId}_${entryId}`);
                  const clean = sanitizeForFirestore(entryData) || {};
                  clean.studentAdmn = String(admnId);
                  clean.entryId = String(entryId);
                  batch.set(docRef, clean, { merge: true });
                  opCount++;
                  if (opCount >= 400) await commitBatch("(fees_entries)");
                }
              }
            }
          }


                        // Special branch 3: Attendance nested by admn and month
          else if (rootKey === "attendance") {
            for (const [admnId, monthsMap] of Object.entries(rootData)) {
              if (monthsMap && typeof monthsMap === "object") {
                for (const [monthName, daysMap] of Object.entries(monthsMap)) {
                  const docRef = doc(db, "attendance", `${admnId}_${monthName}`);
                  const clean = sanitizeForFirestore(daysMap) || {};
                  clean.admn = String(admnId);
                  clean.month = monthName;
                  batch.set(docRef, clean, { merge: true });
                  opCount++;
                  if (opCount >= 400) await commitBatch("(attendance)");
                }
              }
            }
          }
          // Special branch 4: Points & Points Logs (Fixes Property 1789612551653 error)
          else if (rootKey === "points" || rootKey === "teacher_points_logs") {
            for (const [pId, pPayload] of Object.entries(rootData)) {
              const safeDocId = String(pId).replace(/[\/\.]/g, "_");
              const docRef = doc(db, rootKey, `log_${safeDocId}`);
              let clean = sanitizeForFirestore(pPayload);

              if (typeof clean !== "object" || clean === null) {
                clean = { value: clean, id: safeDocId };
              } else {
                clean.id = safeDocId;
              }

              batch.set(docRef, clean, { merge: true });
              opCount++;
              if (opCount >= 400) await commitBatch(`(${rootKey})`);
            }
          }
          // Default branch for all other collections
          else {
            for (const [docId, payload] of Object.entries(rootData)) {
              const safeDocId = String(docId).replace(/[\/\.]/g, "_");
              const docRef = doc(db, rootKey, safeDocId);
              let clean = sanitizeForFirestore(payload);

              if (typeof clean !== "object" || clean === null) {
                clean = { value: clean };
              }

              // Guard against numeric key maps inside root document fields
              if (typeof clean === "object" && clean !== null && !Array.isArray(clean)) {
                const sanitizedMap = {};
                for (const [fieldKey, fieldVal] of Object.entries(clean)) {
                  // Agar field key timestamp ya long number ho to prefix do taaki Firestore array na samjhe
                  const safeFieldKey = (!isNaN(Number(fieldKey)) && fieldKey.length >= 10) ? `rec_${fieldKey}` : fieldKey;
                  sanitizedMap[safeFieldKey] = fieldVal;
                }
                clean = sanitizedMap;
              }

              batch.set(docRef, clean, { merge: true });
              opCount++;
              if (opCount >= 400) await commitBatch(`(${rootKey})`);
            }
          }


          processedKeys++;
          const currentPct = 25 + Math.round((processedKeys / rootKeys.length) * 70);
          progressBar.style.width = `${currentPct}%`;
        }

        // Commit any remaining writes
        await commitBatch("(final)");

        progressBar.style.width = "100%";
        log(`Migration Completed Successfully! Total documents created: ${totalDocsCommitted}`, "success");
        alert("✔ All data from RTDB export has been cleanly migrated to Cloud Firestore!");

      } catch (err) {
        log("Migration Error: " + err.message, "error");
        console.error("Migration Trace:", err);
        alert("Migration Error: " + err.message);
      } finally {
        startBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
